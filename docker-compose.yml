services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ganache
    environment:
      - MONGO_URI=mongodb://mongo:27017/openaq_db
    networks:
      - app_network
    env_file:
      - ./backend/.env

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: openaq_db

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      - mongo
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - truffle
    networks:
      - app_network
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./blockchain/build/contracts:/app/src/abis

  ganache:
    image: trufflesuite/ganache-cli:latest
    container_name: ganache
    ports:
      - "8545:8545"
    command: -p 8545 -h 0.0.0.0 --networkId 5777 -d --accounts 10 --mnemonic "candy maple cake sugar pudding cream honey rich smooth crumble sweet treat" --db /app/data
    networks:
      - app_network
    environment:
      - NETWORK_ID=5777
    volumes:
      - ganache_data:/app/data

  truffle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truffle
    working_dir: /app/blockchain
    volumes:
      - ./blockchain:/app/blockchain
    command: truffle develop
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
  ganache_data:

